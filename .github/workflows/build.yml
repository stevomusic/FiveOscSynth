name: Build plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: FiveOscSynth-${{ runner.os }}
          path: |
            build/FiveOscSynth_artefacts/Release/VST3
            build/FiveOscSynth_artefacts/Release/Standalone
            build/FiveOscSynth_artefacts/Release/AU
